version: 2
updates:
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # CodeQL updates must be applied together to avoid breaking the build.
      codeql:
        patterns:
         - "github/codeql-action/*"
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/scenario/fixtures/chaincode/golang/*"
    schedule:
      interval: weekly
    groups:
      # Single PR to update a specific dependency in multiple directories.
      go:
        group-by: dependency-name
  - package-ecosystem: npm
    versioning-strategy: increase
    allow:
      # Avoid incrementing patch level in production dependencies to keep version ranges more compatible.
      - dependency-type: production
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-type: development
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    ignore:
      # TypeScript updates are managed explicitly to avoid breaking changes.
      - dependency-name: typescript
      # Node major version must remain at the current supported runtime version.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    directories:
      - "/node"
      - "/scenario/node"
      - "/scenario/fixtures/chaincode/node/*"
    schedule:
      interval: weekly
    groups:
      # Dev updates of multiple packages (such as ESLint) must be applied together.
      dev:
        dependency-type: development
      # Single PR to update a specific dependency in multiple directories.
      node:
        group-by: dependency-name
  - package-ecosystem: maven
    directory: "/java"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    versioning-strategy: increase
    directory: "/"
    schedule:
      interval: weekly
